# Render Blueprint: one free web service that serves both the API and the
# built frontend (see Dockerfile). In Render: New -> Blueprint -> pick this
# repo, then paste your OpenRouter key when prompted.
services:
  - type: web
    name: gem-exchange
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: anthropic/claude-sonnet-4.5
      - key: OPENROUTER_SITE_NAME
        value: Gem Exchange Demo
